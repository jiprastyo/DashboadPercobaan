name: Monthly Scrapers

on:
  schedule:
    # Run on the 1st of every month at 02:00 UTC (09:00 WIB)
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run BI PMI Scraper
        run: npx tsx scripts/scrapers/bi-pmi.ts
        continue-on-error: true

      - name: Run ASEAN NSO Scraper
        run: npx tsx scripts/scrapers/asean-nso.ts
        continue-on-error: true

      - name: Run ASEAN Fallback Scraper
        run: npx tsx scripts/scrapers/asean-fallback.ts
        continue-on-error: true

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update monthly data [skip ci]" && git push)
