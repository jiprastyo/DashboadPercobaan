name: Daily Scrape

on:
  schedule:
    # Run daily at 08:24 WIB and 20:24 WIB.
    - cron: '24 1 * * *'
    - cron: '24 13 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even if already ran today'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  scrape-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Collect publisher news
        timeout-minutes: 12
        run: npx tsx scripts/run-news-collection.ts

      - name: Merge daily news into archive
        run: npx tsx scripts/merge-daily-news-archive.ts

      - name: Commit and push collected news
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/news/ data/ops/ data/_metadata.json
          git diff --staged --quiet || git commit -m "chore(data): daily scrape $(date -u +%Y-%m-%d)"
          git push

      - name: Run optional AI enrichment
        continue-on-error: true
        timeout-minutes: 8
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npx tsx scripts/summarizer/gemini-summarize.ts

      - name: Commit optional enrichment
        if: always()
        run: |
          git add data/summaries/ data/ops/ data/_metadata.json
          git diff --staged --quiet || git commit -m "chore(data): enrich daily news $(date -u +%Y-%m-%d)"
          git push
