name: Daily Scrape

on:
  schedule:
    # Run daily at 08:24 WIB and 20:24 WIB.
    # Cadence rationale: the 30 configured news outlets (24 RSS + 6 HTML)
    # publish continuously all day, so this is a polling-frequency choice,
    # not a source cadence -- 2x/day catches the morning and evening news
    # cycles without hammering free RSS/HTML feeds more than needed.
    - cron: '24 1 * * *'
    - cron: '24 13 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even if already ran today'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  scrape-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Collect publisher news
        timeout-minutes: 12
        run: npx tsx scripts/run-news-collection.ts

      - name: Merge daily news into archive
        run: npx tsx scripts/merge-daily-news-archive.ts

      - name: Freshness report
        if: always()
        run: npx tsx scripts/ops/freshness.ts

      - name: Commit and push collected news
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/news/ data/ops/ data/freshness/ data/_metadata.json
          git diff --staged --quiet || git commit -m "chore(data): daily scrape $(date -u +%Y-%m-%d)"
          bash scripts/ops/push-with-rebase.sh

      - name: Run optional AI enrichment
        continue-on-error: true
        # 8 minutes was not enough: the 2026-09-18 run timed out at batch 12/18
        # and silently committed no summaries (continue-on-error hid it).
        timeout-minutes: 15
        env:
          # All keys go through the vars the code actually reads. Each Gemini
          # and Groq entry is a SEPARATE free account (owner confirmed
          # 2026-09-18), so each brings its own free-tier quota instead of
          # sharing one cap. Mistral is the newest addition and holds the
          # tail of the chain.
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEY }},${{ secrets.GEMINI_API_KEY2 }},${{ secrets.GEMINI_API_KEY_BACKUP }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEY }},${{ secrets.GROQ_API_KEY2 }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: npx tsx scripts/summarizer/gemini-summarize.ts

      - name: Commit optional enrichment
        if: always()
        run: |
          git add data/summaries/ data/ops/ data/freshness/ data/_metadata.json
          git diff --staged --quiet || git commit -m "chore(data): enrich daily news $(date -u +%Y-%m-%d)"
          bash scripts/ops/push-with-rebase.sh
