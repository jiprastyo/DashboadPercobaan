name: Daily Scrapers

on:
  schedule:
    # Run every day at 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Setkab Scraper
        run: npx tsx scripts/scrapers/setkab.ts
        continue-on-error: true

      - name: Run News Aggregator
        run: npx tsx scripts/scrapers/news-aggregator.ts
        continue-on-error: true

      - name: Run Gemini Summarizer
        run: npx tsx scripts/scrapers/gemini-summarize.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        continue-on-error: true

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily data [skip ci]" && git push)
