name: Scrape Academic Research (Scholar)

on:
  schedule:
    # Run every Sunday at 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-scholar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Scholar Scraper
        run: npx tsx scripts/scrapers/scholar.ts
        continue-on-error: true

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/research/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update academic research data [skip ci]" && git push)
