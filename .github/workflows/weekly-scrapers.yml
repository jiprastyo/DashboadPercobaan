name: Weekly Scrapers

on:
  schedule:
    # Run every Sunday at 01:00 UTC (08:00 WIB)
    - cron: '0 1 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/scrapers/requirements.txt || echo "No requirements.txt found, skipping..."

      - name: Run BPS HTML Scraper
        run: npx tsx scripts/scrapers/bps-html.ts
        continue-on-error: true

      - name: Run BPS Provincial Data Scraper
        run: npx tsx scripts/scrapers/bps-provinsi.ts
        continue-on-error: true

      - name: Run Kemenaker Scraper
        run: npx tsx scripts/scrapers/kemenaker.ts
        continue-on-error: true

      - name: Run Google Trends Node Scraper
        run: npx tsx scripts/scrapers/google-trends-node.ts
        continue-on-error: true

      - name: Run Google Trends Python Scraper
        run: python scripts/scrapers/google-trends-py.py
        continue-on-error: true

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weekly data [skip ci]" && git push)
