name: Tests

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly Sun 03:17 UTC (10:17 WIB) — owner-approved cadence to save Actions
    # credit (was going to be nightly). Push/PR runs still catch breakage in
    # between; this schedule line exists to catch data-age drift
    # (asean-coverage <40d) when nothing was pushed for a while.
    - cron: '17 3 * * 0'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run guard tests
        run: npm test
